<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мини-библиотека</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <a class="brand" href="/">📚 Мини-библиотека</a>
        <a class="docs-link" href="/docs" target="_blank" rel="noopener noreferrer">Открыть API ↗</a>
      </div>
    </header>

    <main class="container">
      <section class="intro">
        <div>
          <span class="eyebrow">Учебный проект FastAPI + SQLite</span>
          <h1>Учёт книг и выдач</h1>
          <p>Пять справочников, 25 API-операций и отдельная страница для проверки изменений после развёртывания.</p>
        </div>
        <span class="version">Версия 1 · основная ветка</span>
      </section>

      <nav class="tabs" aria-label="Разделы библиотеки" id="tabs"></nav>

      <section class="workspace">
        <div class="panel records-panel">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">Записи в базе</span>
              <h2 id="section-title">Авторы</h2>
            </div>
            <button class="button button-secondary" id="refresh-button" type="button">Обновить</button>
          </div>
          <div class="table-scroll" id="records"></div>
        </div>

        <div class="panel form-panel">
          <span class="eyebrow" id="form-eyebrow">Новая запись</span>
          <h2 id="form-title">Добавить автора</h2>
          <form id="record-form"></form>
        </div>
      </section>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
