<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Библиотека</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-row">
        <a class="brand" href="/">Библиотека</a>
        <a class="docs-link" href="/docs" target="_blank" rel="noopener noreferrer">Документация API</a>
      </div>
    </header>

    <main class="container">
      <section class="intro">
        <h1>Учёт книг</h1>
        <p>Здесь можно добавлять, изменять и удалять данные библиотеки.</p>
      </section>

      <nav class="tabs" aria-label="Разделы библиотеки" id="tabs"></nav>

      <section class="workspace">
        <section class="panel records-panel">
          <div class="panel-heading">
            <h2 id="section-title">Авторы</h2>
            <button class="button button-secondary" id="refresh-button" type="button">Обновить</button>
          </div>
          <div class="table-scroll" id="records"></div>
        </section>

        <section class="panel form-panel">
          <p id="form-eyebrow">Новая запись</p>
          <h2 id="form-title">Добавить автора</h2>
          <form id="record-form"></form>
        </section>
      </section>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
