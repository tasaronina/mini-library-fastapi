
name: mini-library-fastapi

services:
  api:
    image: ${APP_IMAGE:-mini-library-fastapi:lab2}
    environment:
      LIBRARY_DB_PATH: /data/library.db
    volumes:
      - library_data:/data
    expose:
      - "8000"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  library_data:
    name: mini-library-fastapi_library_data
